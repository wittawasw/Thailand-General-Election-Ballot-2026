<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Thailand Election Ballot{% endblock %}</title>
    <style>
      body {
        max-width: 1100px;
        margin: 32px auto;
        padding: 0 16px;
        color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      a {
        color: #0b5cad;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }

      th,
      td {
        border-bottom: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }

      th {
        background: #f5f5f5;
      }

      .number {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .diff-positive {
        color: #087f5b;
      }

      .diff-negative {
        color: #c92a2a;
      }

      .nowrap {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
